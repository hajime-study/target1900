<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e88e5">

    <link rel="apple-touch-icon" sizes="180x180" href="https://hajime-study.github.io/target1900/target1900.png">
    <link rel="apple-touch-icon" sizes="152x152" href="https://hajime-study.github.io/target1900/target1900.png">
    <link rel="apple-touch-icon" sizes="120x120" href="https://hajime-study.github.io/target1900/target1900.png">
    <link rel="icon" type="image/png" href="https://hajime-study.github.io/target1900/target1900.png">
    <link rel="manifest" href="manifest.json">

    <title>はじめ1900</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    <style>
        body {
            margin: 0; /* 画面全体の余計な余白を消す */
        }

        .page-wrapper {
            display: flex;
            justify-content: flex-start; /* 左寄せにする */
            align-items: flex-start;
            padding: 10px; /* 左側（外側）の余白を最小限の10pxに！ */
            gap: 20px; /* アプリと広告の間の隙間 */
        }

        /* アプリ本体（四角形）を最初ぐらい大きく保つ設定 */
        .container {
            flex: 1 1 auto; /* 縮ませず、可能な限りスペースを広げる */
            width: 100%; 
            margin: 0 !important; /* 元のCSSの「中央寄せ」を強制解除して左にピタッと寄せる */
        }

        /* 完全に独立した右側の広告エリア */
        .ad-sidebar {
            flex: 0 0 auto; /* 広告エリアが押し潰されないように固定 */
            width: 320px; /* 一般的なPC用広告がすっぽり入る幅（広め） */
            padding-top: 20px; /* 広告が少し上すぎる場合はここで調整 */
        }
        
        /* スマホなど画面が狭いとき（縦並びに変更） */
        @media (max-width: 1000px) {
            .page-wrapper {
                flex-direction: column;
                align-items: center;
                padding: 10px;
            }
            .container {
                margin: 0 auto !important; /* スマホの時は見栄え良く中央寄せに戻す */
            }
            .ad-sidebar {
                width: 100%;
                text-align: center; /* 広告を真ん中に */
                padding-top: 10px;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="splashScreen">
        <h1 class="splashTitle">はじめ1900 <i class="fas fa-book-open"></i></h1>
    </div>

    <div class="page-wrapper">

        <div class="container">
            <h1>はじめ1900</h1>

            <div class="layout-wrapper">
                <div class="left-pane" id="settings">
                    <div class="input-group">
                        <label><i class="fas fa-sliders-h"></i> モード選択：</label>
                        <select id="mainMode">
                            <option value="">選択してください</option>
                            <option value="test">テストモード</option>
                            <option value="memorize">暗記モード</option>
                        </select>
                    </div>

                    <div id="subSettings"></div>

                    <div class="input-group" id="rangeSection">
                        <label><i class="fas fa-list-ol"></i> 出題範囲：</label>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <input type="number" id="startNumber" value="1" placeholder="開始">
                            <span>〜</span>
                            <input type="number" id="endNumber" value="1900" placeholder="終了">
                        </div>
                    </div>

                    <div class="input-group" id="numQuestionsLabel">
                        <label><i class="fas fa-layer-group"></i> 出題数：</label>
                        <input type="number" id="numQuestions" value="10">
                    </div>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="weakOnly"> 
                            <i class="fas fa-star" style="color: #ff9800;"></i> 苦手ボックスのみから出題
                        </label>
                    </div>

                    <button id="startBtn" class="btn-pop btn-pop-blue" style="width: 100%; margin-top: 15px;">
                        開始 <i class="fas fa-play"></i>
                    </button>
                </div>

                <div class="right-pane">
                    
                    <div class="empty-state" id="empty-state">
                        <i class="fas fa-pencil-alt"></i><br>
                        設定をして<br>「開始」を押してください
                    </div>

                    <section id="quiz" class="hidden">
                        <h2><i class="fas fa-pen"></i> テストモード</h2>
                        <div id="quizContainer"></div>
                    </section>

                    <section id="memorizeSection" class="hidden">
                        <h2><i class="fas fa-book"></i> 暗記モード</h2>
                        
                        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
                            <button id="showAllBtn" class="btn-pop btn-pop-green">すべて表示 <i class="fas fa-eye"></i></button>
                            <button id="hideAllBtn" class="btn-pop btn-pop-blue">すべて隠す <i class="fas fa-eye-slash"></i></button>
                        </div>

                        <div id="memorizeBox"></div>
                    </section>
                </div>
            </div>
        </div>
        <div class="ad-sidebar">
            <script src="https://adm.shinobi.jp/s/325dbf9005396dafc117fe1fdb915397"></script>
            </div>
        </div>
    <script src="app.js"></script>
    <script>
        /* 起動アニメーション */
        window.addEventListener("load", () => {
            setTimeout(() => {
                document.getElementById("splashScreen").style.opacity = 0;
                setTimeout(() => {
                    document.getElementById("splashScreen").style.display = "none";
                }, 400);
            }, 1300);
        });
    </script>
</body>
</html>
